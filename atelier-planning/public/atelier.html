<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Écran atelier</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    :root {
      --bg: #0d0d0d; --surface: #181818; --surface-2: #222222; --border: #2b2b2b;
      --text: #f2f2f2; --muted: #9a9a9a; --accent: #ffe500;
      --fab: #cbb08a; --pose: #e9d9c1; --deliv: #6fcf97; --danger: #ff8a7a; --warning: #ffe500;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #f0f0f0; --surface: #ffffff; --surface-2: #f6f6f5; --border: #e3e3e1;
      --text: #111111; --muted: #6b6b6b; --accent: #111111;
      --fab: #a9835a; --pose: #252a24; --deliv: #2f7d55; --danger: #b42318; --warning: #946200;
      color-scheme: light;
    }
@font-face {
  font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url("fonts/inter-latin-ext-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}
@font-face {
  font-family: "Inter"; font-style: normal; font-display: swap; font-weight: 100 900;
  src: url("fonts/inter-latin-wght-normal.woff2") format("woff2-variations");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
    * { box-sizing: border-box; }
    html, body, #root { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased;
      font-size: clamp(14px, 1.15vw, 22px); line-height: 1.35; padding: 1.2em 1.5em; overflow: hidden; }
    header { display: flex; align-items: baseline; gap: .8em; margin-bottom: 1em; }
    header .logo { width: 2.6em; height: 2.6em; align-self: center; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.22); }
    :root[data-theme="light"] header .logo { box-shadow: none; }
    header h1 { margin: 0; font-size: 1.7em; font-weight: 300; letter-spacing: .3em; text-transform: uppercase; }
    header h1 small { font-size: .38em; letter-spacing: .2em; color: var(--muted); font-weight: 400; margin-left: .6em; }
    header .date { font-size: 1.3em; color: var(--muted); text-transform: capitalize; }
    header .clock { margin-left: auto; font-size: 2.6em; font-weight: 600; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
    .wrap { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1fr); gap: 1em; height: calc(100% - 4.5em); }
    .col { display: flex; flex-direction: column; gap: 1em; min-height: 0; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: .8em; padding: .8em 1em; min-height: 0; overflow: hidden; }
    .panel h2 { margin: 0 0 .5em; font-size: .85em; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
    .today-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1em; }
    .today-grid h3 { margin: 0 0 .3em; font-size: 1em; display: flex; align-items: center; gap: .4em; }
    .dot { width: .7em; height: .7em; border-radius: 50%; display: inline-block; }
    .item { padding: .35em 0; border-bottom: 1px solid var(--border); display: flex; gap: .5em; align-items: baseline; }
    .item:last-child { border-bottom: 0; }
    .item .t { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .s { color: var(--muted); font-size: .85em; white-space: nowrap; }
    .big { font-size: 1.15em; }
    .none { color: var(--muted); font-style: italic; }
    .weeks { flex: 1; display: flex; flex-direction: column; gap: .6em; min-height: 0; }
    .week { display: grid; gap: .4em; flex: 1; min-height: 0; }
    .day { background: var(--surface); border: 1px solid var(--border); border-radius: .7em; padding: .4em .5em; display: flex; flex-direction: column; gap: .25em; min-width: 0; overflow: hidden; }
    .day.today { border: 2px solid var(--accent); }
    .day.past { opacity: .45; }
    .day.off { background: var(--surface-2); }
    .day-head { display: flex; align-items: baseline; gap: .4em; font-size: .85em; font-weight: 700; }
    .day-head .dn { text-transform: capitalize; }
    .day-head .load { margin-left: auto; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
    .day-head .load.over { color: var(--danger); font-weight: 700; }
    .loadbar { height: .3em; border-radius: 1em; background: var(--surface-2); overflow: hidden; }
    .loadbar span { display: block; height: 100%; background: var(--fab); }
    .ev { font-size: .8em; padding: .15em .4em; border-radius: .25em; border-left: .3em solid; background: var(--surface-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ev.fab { border-color: var(--fab); }
    .ev.pose { border-color: var(--pose); font-weight: 700; }
    .ev.deliv { border-color: var(--deliv); }
    .alert-n { font-size: 2em; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .danger { color: var(--danger); }
    .warning { color: var(--warning); }
    .ok { color: var(--deliv); }
    .status { position: fixed; bottom: .4em; right: 1em; font-size: .7em; color: var(--muted); }
    .status.lost { color: var(--danger); font-weight: 700; }
    .error-screen { display: grid; place-items: center; height: 100%; text-align: center; color: var(--muted); }
    @media (max-width: 900px) {
      body { overflow: auto; font-size: 15px; padding: 12px 16px; }
      .wrap { grid-template-columns: 1fr; height: auto; }
      .today-grid { grid-template-columns: 1fr; }
      .week { grid-template-columns: 1fr !important; }
      .day.past { display: none; }
      header { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="root"><div class="error-screen">Chargement du planning…</div></div>
  <div class="status" id="status"></div>
  <script src="js/atelier.js"></script>
</body>
</html>
